name: ci

on:
  push:
    branches: [main, "demo/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # ghcr.io exige des minuscules : docker/metadata-action normalise le nom
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  image:
    name: Image, analyse, publication
    runs-on: ubuntu-latest
    # Si le lint ou un test echoue, ce job ne demarre pas : rien n'est construit ni publie.
    needs: quality
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag tracable : le SHA court du commit. Les tags Git vX.Y.Z donnent aussi X.Y.Z.
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction (image locale pour l'analyse)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: game-telemetry:scan
          build-args: |
            BUILD=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumee (l'image demarre, sans root, et repond)
        run: |
          test "$(docker inspect -f '{{.Config.User}}' game-telemetry:scan)" = "65532:65532"
          docker run -d --name smoke -p 8080:8080 game-telemetry:scan
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          curl -fsS http://localhost:8080/metrics | grep -q '^game_telemetry_build_info'
          docker rm -f smoke

      - name: Analyse de vulnerabilites (rapport complet, informatif)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: game-telemetry:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Analyse de vulnerabilites (bloquante sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: game-telemetry:scan
          format: table
          severity: CRITICAL
          # exit-code 1 : une seule vulnerabilite critique fait echouer le pipeline, avant la publication.
          exit-code: "1"
          # seules les failles qui ont un correctif bloquent : on ne peut rien faire des autres
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Connexion au registre
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/demo/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/demo/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

  compose:
    name: Validation du deploiement
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config --quiet
      - name: Regles Prometheus
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/rules/recording.yml /etc/prometheus/rules/alerts.yml
